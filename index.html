<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetFlow - Iniciar Sesión</title>
    <style>
        :root {
            --bg-color: #F4F6F9;
            --text-main: #2C3E50;
            --color-disponibles: #27AE60;
            --card-bg: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 0px; /* Reducimos el hueco para que queden más unidos */
            font-size: 32px;
            font-weight: bold;
        }
        .logo-img {
            width: 70px; /* Doblamos el tamaño para compensar los márgenes */
            height: auto;
            margin-right: -15px; /* Lo acercamos un poco al texto */
        }

        /* Pantalla de Carga */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            margin-top: 20px;
            width: 40px; height: 40px;
            border: 4px solid #E5E7E9;
            border-top: 4px solid var(--color-disponibles);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Pantalla de Inicio de Sesión */
        #login-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .login-card {
            background-color: var(--card-bg);
            width: 100%;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        
        /* Formulario con mayor separación */
        #form-login {
            display: flex;
            flex-direction: column;
            gap: 25px; /* Mayor espacio entre campos */
            width: 100%;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #D5D8DC;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: var(--color-disponibles); }
        
        .btn-login {
            width: 100%;
            padding: 15px;
            background-color: var(--text-main);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-registro {
            width: 100%;
            padding: 15px;
            background-color: var(--color-disponibles);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .enlaces-footer {
            text-align: center;
            margin-top: 5px;
        }
        .enlaces-footer a {
            color: var(--text-main);
            text-decoration: underline;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA (Splash Screen) -->
    <div id="splash-screen">
        <!-- Añadimos id="splash-logo" y opacity: 0 por defecto -->
        <div class="logo-container" id="splash-logo" style="opacity: 0; transition: opacity 0.2s ease;">
            <!-- Añadimos el evento onload para que muestre todo a la vez -->
            <img src="logo.png" alt="Logo" class="logo-img" onload="document.getElementById('splash-logo').style.opacity = '1'" onerror="this.style.display='none'">
            <div>
                <span style="color: #000000;">Budget</span><span style="color: var(--color-disponibles);">Flow</span>
            </div>
        </div>
        <div class="spinner"></div>
    </div>

    <!-- PANTALLA DE INICIO DE SESIÓN -->
    <div id="login-screen">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div>
                <span style="color: #000000;">Budget</span><span style="color: var(--color-disponibles);">Flow</span>
            </div>
        </div>
        
        <div class="login-card">
            <form id="form-login">
                <input type="text" id="usuario" placeholder="Usuario" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
            <button class="btn-registro" id="btn-crear-cuenta">Registrarse</button>
            <div class="enlaces-footer">
                <a id="btn-recuperar">Recuperar contraseña</a>
            </div>
        </div>
    </div>

    <!-- CONEXIÓN A FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-mVOFawjgVqHaiLO7TjY5JMaaWDjEof0",
            authDomain: "budgetflow-a1f80.firebaseapp.com",
            projectId: "budgetflow-a1f80",
            storageBucket: "budgetflow-a1f80.firebasestorage.app",
            messagingSenderId: "29395070663",
            appId: "1:29395070663:web:16e9db163af21b44e718e2",
            measurementId: "G-L7TQ65BLBH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const login = document.getElementById('login-screen');
                
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    login.style.display = 'flex';
                }, 500); 
            }, 2000); 
        });
    </script>
</body>
</html>
