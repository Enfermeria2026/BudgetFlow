<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetFlow - Iniciar Sesión</title>
    <style>
        :root {
            --bg-color: #F4F6F9;
            --text-main: #2C3E50;
            --color-disponibles: #27AE60;
            --color-retenidos: #E74C3C;
            --card-bg: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main); padding: 20px; box-sizing: border-box;
        }
        .logo-container { display: flex; align-items: center; justify-content: center; gap: 0px; font-size: 32px; font-weight: bold; }
        .logo-img { width: 70px; height: auto; margin-right: -5px; }
        
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease;
        }
        .spinner {
            margin-top: 20px; width: 40px; height: 40px; border: 4px solid #E5E7E9;
            border-top: 4px solid var(--color-disponibles); border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #login-screen {
            display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px;
        }
        .card {
            background-color: var(--card-bg); width: 100%; padding: 30px 20px; border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; margin-top: 30px;
        }
        .form-group { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        
        .password-container { position: relative; display: flex; align-items: center; }
        .password-container input { padding-right: 45px; } 
        .toggle-password {
            position: absolute; right: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .eye-icon { width: 20px; height: 20px; stroke: #000000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        input { width: 100%; padding: 15px; border: 1px solid #D5D8DC; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: var(--color-disponibles); }
        
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .btn-principal { background-color: var(--text-main); color: white; }
        .btn-principal:disabled { background-color: #BDC3C7; cursor: not-allowed; }
        .btn-secundario { background-color: var(--color-disponibles); color: white; }
        
        .enlaces-footer { text-align: center; margin-top: 5px; }
        .enlaces-footer a { color: var(--text-main); text-decoration: underline; font-size: 14px; cursor: pointer; }
        
        #mensaje-error { 
            color: var(--color-retenidos); background-color: #FDEDEC; padding: 10px; 
            border-radius: 8px; font-size: 14px; font-weight: bold; text-align: center; 
            display: none; margin: 0; border: 1px solid #F5B7B1;
        }

        /* MODAL PARA DOBLE VERIFICACIÓN */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none; align-items: center; justify-content: center;
            z-index: 10000;
        }
        .modal-content {
            background-color: var(--card-bg); padding: 30px 20px; border-radius: 12px;
            text-align: center; width: 90%; max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 15px;
        }
        .modal-title { font-size: 18px; font-weight: bold; color: var(--text-main); margin: 0; }
        .modal-text { font-size: 14px; color: #7F8C8D; margin: 0; }
        #error-2fa { color: var(--color-retenidos); font-size: 13px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA -->
    <div id="splash-screen">
        <div class="logo-container" id="splash-logo" style="opacity: 0; transition: opacity 0.2s ease;">
            <img src="logo.png" alt="Logo" class="logo-img" onload="document.getElementById('splash-logo').style.opacity = '1'" onerror="this.style.display='none'">
            <div><span style="color: #000000;">Budget</span><span style="color: var(--color-disponibles);">Flow</span></div>
        </div>
        <div class="spinner"></div>
    </div>

    <!-- PANTALLA DE INICIO DE SESIÓN -->
    <div id="login-screen">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div><span style="color: #000000;">Budget</span><span style="color: var(--color-disponibles);">Flow</span></div>
        </div>
        
        <div class="card">
            <form id="form-login" class="form-group">
                <input type="text" id="login-identificador" placeholder="Correo electrónico o Usuario" required>
                
                <div class="password-container">
                    <input type="password" id="login-password" placeholder="Contraseña" required>
                    <span class="toggle-password" onclick="togglePassword('login-password', this)">
                        <svg class="eye-icon eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-icon eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </span>
                </div>

                <p id="mensaje-error"></p>

                <button type="submit" class="btn-principal" id="btn-iniciar-sesion">Iniciar Sesión</button>
            </form>
            
            <button type="button" class="btn-secundario" onclick="window.location.href='register.html'">Registrarse</button>
            
            <div class="enlaces-footer">
                <a id="btn-recuperar">Recuperar usuario y/o contraseña</a>
            </div>
        </div>
    </div>

    <!-- MODAL DE DOBLE VERIFICACIÓN -->
    <div id="modal-2fa" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">Doble Verificación</h3>
            <p class="modal-text" id="texto-2fa">Por favor, introduce tu código de seguridad.</p>
            
            <form id="form-2fa" style="display:flex; flex-direction:column; gap:15px;">
                <input type="password" id="input-2fa" placeholder="Respuesta" required>
                <p id="error-2fa">Respuesta incorrecta.</p>
                <button type="submit" class="btn-secundario">Verificar y Acceder</button>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-mVOFawjgVqHaiLO7TjY5JMaaWDjEof0",
            authDomain: "budgetflow-a1f80.firebaseapp.com",
            projectId: "budgetflow-a1f80",
            storageBucket: "budgetflow-a1f80.firebasestorage.app",
            messagingSenderId: "29395070663",
            appId: "1:29395070663:web:16e9db163af21b44e718e2",
            measurementId: "G-L7TQ65BLBH"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Ojo de contraseña
        window.togglePassword = function(inputId, spanElement) {
            const input = document.getElementById(inputId);
            const eyeOpen = spanElement.querySelector('.eye-open');
            const eyeClosed = spanElement.querySelector('.eye-closed');
            
            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                input.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        };

        // Splash screen lógica
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const login = document.getElementById('login-screen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; login.style.display = 'flex'; }, 500); 
            }, 2000); 
        });

        const formLogin = document.getElementById('form-login');
        const msgError = document.getElementById('mensaje-error');
        const btnIniciar = document.getElementById('btn-iniciar-sesion');
        
        // Elementos 2FA
        const modal2FA = document.getElementById('modal-2fa');
        const form2FA = document.getElementById('form-2fa');
        const texto2FA = document.getElementById('texto-2fa');
        const input2FA = document.getElementById('input-2fa');
        const error2FA = document.getElementById('error-2fa');

        let usuarioValidado = null; // Guardará los datos temporalmente si la contraseña es correcta

        // 1. INICIAR SESIÓN
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgError.style.display = 'none';
            btnIniciar.disabled = true;
            btnIniciar.textContent = 'ACCEDIENDO...';

            const identificador = document.getElementById('login-identificador').value.trim();
            const password = document.getElementById('login-password').value;
            let correoParaLogin = identificador;

            try {
                // Si no tiene arroba, asumimos que es un nombre de usuario y buscamos su correo
                if (!identificador.includes('@')) {
                    const usernameRef = doc(db, 'nombres_usuario', identificador.toLowerCase());
                    const usernameDoc = await getDoc(usernameRef);
                    
                    if (!usernameDoc.exists()) {
                        throw new Error("El usuario no existe.");
                    }
                    const uid = usernameDoc.data().uid;
                    const userDoc = await getDoc(doc(db, 'usuarios', uid));
                    correoParaLogin = userDoc.data().correo;
                }

                // Autenticar en Firebase
                const userCredential = await signInWithEmailAndPassword(auth, correoParaLogin, password);
                const uid = userCredential.user.uid;

                // Descargar ficha del usuario
                const userDoc = await getDoc(doc(db, 'usuarios', uid));
                usuarioValidado = userDoc.data();

                // 2. VERIFICAR DOBLE VERIFICACIÓN
                if (usuarioValidado.dobleVerificacion && usuarioValidado.dobleVerificacion.activa) {
                    // Configurar y mostrar el modal
                    if (usuarioValidado.dobleVerificacion.tipo === 'pin') {
                        texto2FA.textContent = "Introduce tu PIN de 6 dígitos.";
                        input2FA.type = "password";
                        input2FA.maxLength = 6;
                    } else {
                        texto2FA.textContent = "Pregunta de seguridad: " + usuarioValidado.dobleVerificacion.pregunta;
                        input2FA.type = "text";
                        input2FA.maxLength = 100;
                    }
                    modal2FA.style.display = 'flex';
                } else {
                    // Si no tiene 2FA, enrutamos directamente
                    enrutarUsuario(usuarioValidado);
                }

            } catch (error) {
                console.error(error);
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    msgError.textContent = 'Contraseña incorrecta.';
                } else if (error.code === 'auth/user-not-found') {
                    msgError.textContent = 'No hay ninguna cuenta con estos datos.';
                } else {
                    msgError.textContent = error.message || 'Error al iniciar sesión.';
                }
                msgError.style.display = 'block';
            } finally {
                btnIniciar.disabled = false;
                btnIniciar.textContent = 'Iniciar Sesión';
            }
        });

        // 3. VALIDAR LA DOBLE VERIFICACIÓN
        form2FA.addEventListener('submit', (e) => {
            e.preventDefault();
            error2FA.style.display = 'none';

            let respuestaEscrita = input2FA.value;

            // Si es pregunta, limpiamos formato igual que en registro (minúsculas, sin tildes)
            if (usuarioValidado.dobleVerificacion.tipo === 'pregunta') {
                respuestaEscrita = respuestaEscrita.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, "");
            }

            if (respuestaEscrita === usuarioValidado.dobleVerificacion.respuesta) {
                modal2FA.style.display = 'none';
                enrutarUsuario(usuarioValidado); // Respuesta correcta, redirigir
            } else {
                error2FA.textContent = "Respuesta incorrecta. Inténtalo de nuevo.";
                error2FA.style.display = 'block';
            }
        });

        // 4. LÓGICA DE ENRUTAMIENTO (TUTORIAL O DASHBOARD)
        function enrutarUsuario(datosUsuario) {
            // Evaluamos si el tutorial está en 0 (NO REALIZADO)
            if (datosUsuario.tutorialCompletado === 0 || datosUsuario.tutorial === 'NO REALIZADO') {
                window.location.href = 'tutorial.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
