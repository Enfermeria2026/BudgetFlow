<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetFlow - Registro</title>
    <style>
        :root {
            --bg-color: #F4F6F9;
            --text-main: #2C3E50;
            --color-disponibles: #27AE60;
            --color-retenidos: #E74C3C;
            --card-bg: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-main); padding: 20px; box-sizing: border-box;
        }
        .logo-container { 
            display: flex; align-items: center; justify-content: center; gap: 0px; 
            font-size: 32px; font-weight: bold; margin-bottom: 20px; 
        }
        .logo-img { width: 70px; height: auto; margin-right: -5px; }
        
        .card {
            background-color: var(--card-bg); width: 100%; max-width: 400px; padding: 30px 20px;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box;
            display: flex; flex-direction: column; gap: 20px;
        }
        .form-group { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        
        .field-wrapper { display: flex; flex-direction: column; gap: 5px; }
        .input-label { font-size: 14px; font-weight: bold; color: var(--text-main); }
        .asterisco { color: var(--color-retenidos); }

        .password-container { position: relative; display: flex; align-items: center; }
        .password-container input { padding-right: 45px; } 
        .toggle-password {
            position: absolute; right: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .eye-icon { width: 20px; height: 20px; stroke: #000000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        input, select { 
            width: 100%; padding: 15px; border: 1px solid #D5D8DC; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; outline: none; font-family: inherit; 
        }
        input:focus, select:focus { border-color: var(--color-disponibles); }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; }
        .checkbox-group input[type="checkbox"], .radio-group input[type="radio"] { width: auto; padding: 0; transform: scale(1.2); }
        
        #doble-verificacion-opciones { 
            display: none; flex-direction: column; gap: 15px; padding: 15px; 
            background-color: #F9F9F9; border-radius: 8px; border: 1px dashed #D5D8DC; 
        }
        .radio-group { display: flex; gap: 20px; }
        .radio-item { display: flex; align-items: center; gap: 5px; font-size: 14px; }
        
        .aviso-rojo { color: var(--color-retenidos); font-size: 12px; font-weight: bold; }
        #msg-terminos { text-align: center; margin-top: -5px; }
        
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .btn-principal { background-color: var(--text-main); color: white; margin-top: 5px; }
        .btn-principal:disabled { background-color: #BDC3C7; cursor: not-allowed; }
        
        .enlaces-footer { text-align: center; margin-top: 5px; }
        .enlaces-footer a { color: var(--text-main); text-decoration: underline; font-size: 14px; cursor: pointer; }
        
        #mensaje-error { 
            color: var(--color-retenidos); background-color: #FDEDEC; padding: 10px; 
            border-radius: 8px; font-size: 14px; font-weight: bold; text-align: center; 
            display: none; margin: 0; border: 1px solid #F5B7B1;
        }

        /* ESTILOS DE LA VENTANA EMERGENTE (MODAL) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none; /* Oculto por defecto */
            align-items: center; justify-content: center;
            z-index: 10000;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .modal-icon {
            width: 60px; height: 60px;
            background-color: #E8F5E9;
            color: var(--color-disponibles);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }
        .modal-title { font-size: 20px; font-weight: bold; color: var(--text-main); margin: 0; }
        .modal-text { font-size: 15px; color: #7F8C8D; margin: 0; }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        <div><span style="color: #000000;">Budget</span><span style="color: var(--color-disponibles);">Flow</span></div>
    </div>

    <div class="card">
        <form id="form-registro" class="form-group">
            
            <div class="field-wrapper">
                <label class="input-label" for="reg-nombre">Nombre <span class="asterisco">*</span></label>
                <input type="text" id="reg-nombre" placeholder="Escribe tu nombre" required>
            </div>
            
            <div class="field-wrapper">
                <label class="input-label" for="reg-apellidos">Apellidos <span class="asterisco">*</span></label>
                <input type="text" id="reg-apellidos" placeholder="Escribe tus apellidos" required>
            </div>
            
            <div class="field-wrapper">
                <label class="input-label" for="reg-fecha">Fecha de nacimiento</label>
                <input type="date" id="reg-fecha" title="Fecha de nacimiento">
            </div>
            
            <div class="field-wrapper">
                <label class="input-label" for="reg-correo">Correo electrónico <span class="asterisco">*</span></label>
                <input type="email" id="reg-correo" placeholder="Escribe tu correo electrónico" required>
            </div>
            
            <div class="field-wrapper">
                <label class="input-label" for="reg-usuario">Nombre de usuario <span class="asterisco">*</span></label>
                <input type="text" id="reg-usuario" placeholder="Elije tu nombre de usuario" required>
            </div>
            
            <div class="field-wrapper">
                <label class="input-label" for="reg-password">Contraseña <span class="asterisco">*</span></label>
                <div class="password-container">
                    <input type="password" id="reg-password" placeholder="Crea una contraseña" required>
                    <span class="toggle-password" onclick="togglePassword('reg-password', this)">
                        <svg class="eye-icon eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-icon eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </span>
                </div>
            </div>
            
            <div class="field-wrapper">
                <label class="input-label" for="reg-password-rep">Repetir contraseña <span class="asterisco">*</span></label>
                <div class="password-container">
                    <input type="password" id="reg-password-rep" placeholder="Repite la contraseña" required>
                    <span class="toggle-password" onclick="togglePassword('reg-password-rep', this)">
                        <svg class="eye-icon eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-icon eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </span>
                </div>
            </div>
            
            <p id="mensaje-error"></p>

            <label class="checkbox-group">
                <input type="checkbox" id="check-doble-verificacion">
                Activar doble verificación al iniciar sesión
            </label>
            
            <div id="doble-verificacion-opciones">
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="tipo_2fa" value="pin" id="radio-pin"> PIN</label>
                    <label class="radio-item"><input type="radio" name="tipo_2fa" value="pregunta" id="radio-pregunta"> Pregunta</label>
                </div>

                <input type="text" id="input-pin" placeholder="PIN de 6 dígitos" maxlength="6" style="display:none;" pattern="\d{6}">
                
                <div id="bloque-pregunta" style="display:none; flex-direction:column; gap:10px;">
                    <select id="select-pregunta">
                        <option value="">Selecciona una pregunta...</option>
                        <option value="ciudad">¿En qué ciudad nací?</option>
                        <option value="mascota">¿Cómo se llama mi primera mascota?</option>
                        <option value="animal">¿Cuál es mi animal favorito?</option>
                        <option value="pais">¿Cuál es mi país favorito?</option>
                        <option value="otra">Otra...</option>
                    </select>
                    <input type="text" id="input-pregunta-otra" placeholder="Escribe tu pregunta" style="display:none;">
                    <input type="text" id="input-respuesta" placeholder="Respuesta">
                    <span class="aviso-rojo">Escribe la respuesta en minúsculas y sin tildes.</span>
                </div>
            </div>

            <label class="checkbox-group" style="margin-top: 10px;">
                <input type="checkbox" id="check-terminos">
                Acepto los términos y condiciones de uso <span class="asterisco">*</span>
            </label>
            <p id="msg-terminos" class="aviso-rojo">* Acepta los términos y condiciones para poder finalizar el registro</p>

            <button type="submit" class="btn-principal" id="btn-registrar" disabled>REGISTRAR</button>
        </form>
        
        <div class="enlaces-footer">
            <a onclick="window.location.href='index.html'">Volver al inicio de sesión</a>
        </div>
    </div>

    <!-- VENTANA EMERGENTE DE ÉXITO (MODAL) -->
    <div id="modal-exito" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">✓</div>
            <h3 class="modal-title">Cuenta creada</h3>
            <p class="modal-text">Tu cuenta se ha creado correctamente. Ya puedes iniciar sesión en BudgetFlow.</p>
            <button class="btn-principal" id="btn-aceptar-exito">Aceptar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-mVOFawjgVqHaiLO7TjY5JMaaWDjEof0",
            authDomain: "budgetflow-a1f80.firebaseapp.com",
            projectId: "budgetflow-a1f80",
            storageBucket: "budgetflow-a1f80.firebasestorage.app",
            messagingSenderId: "29395070663",
            appId: "1:29395070663:web:16e9db163af21b44e718e2",
            measurementId: "G-L7TQ65BLBH"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Funcionalidad Ojo Contraseña
        window.togglePassword = function(inputId, spanElement) {
            const input = document.getElementById(inputId);
            const eyeOpen = spanElement.querySelector('.eye-open');
            const eyeClosed = spanElement.querySelector('.eye-closed');
            
            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                input.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        };

        // Lógica de Términos
        const checkTerminos = document.getElementById('check-terminos');
        const btnRegistrar = document.getElementById('btn-registrar');
        const msgTerminos = document.getElementById('msg-terminos');

        checkTerminos.addEventListener('change', (e) => {
            if (e.target.checked) {
                btnRegistrar.disabled = false;
                msgTerminos.style.display = 'none';
            } else {
                btnRegistrar.disabled = true;
                msgTerminos.style.display = 'block';
            }
        });

        // Lógica de Doble Verificación UI
        const checkDobleVerif = document.getElementById('check-doble-verificacion');
        const divOpciones = document.getElementById('doble-verificacion-opciones');
        const radioPin = document.getElementById('radio-pin');
        const radioPregunta = document.getElementById('radio-pregunta');
        const inputPin = document.getElementById('input-pin');
        const bloquePregunta = document.getElementById('bloque-pregunta');
        const selectPregunta = document.getElementById('select-pregunta');
        const inputPreguntaOtra = document.getElementById('input-pregunta-otra');
        const inputRespuesta = document.getElementById('input-respuesta');

        checkDobleVerif.addEventListener('change', (e) => {
            divOpciones.style.display = e.target.checked ? 'flex' : 'none';
            if(!e.target.checked) {
                radioPin.checked = false;
                radioPregunta.checked = false;
                inputPin.style.display = 'none';
                bloquePregunta.style.display = 'none';
                inputPin.value = '';
                inputRespuesta.value = '';
            }
        });

        radioPin.addEventListener('change', () => { inputPin.style.display = 'block'; bloquePregunta.style.display = 'none'; });
        radioPregunta.addEventListener('change', () => { inputPin.style.display = 'none'; bloquePregunta.style.display = 'flex'; });
        selectPregunta.addEventListener('change', (e) => { inputPreguntaOtra.style.display = e.target.value === 'otra' ? 'block' : 'none'; });

        inputRespuesta.addEventListener('input', function() {
            this.value = this.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, "");
        });

        // Lógica de Registro
        const formRegistro = document.getElementById('form-registro');
        const msgError = document.getElementById('mensaje-error');
        const modalExito = document.getElementById('modal-exito');
        const btnAceptarExito = document.getElementById('btn-aceptar-exito');

        // Botón Aceptar del Modal
        btnAceptarExito.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        formRegistro.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            msgError.style.display = 'none';

            const nombre = document.getElementById('reg-nombre').value.trim();
            const apellidos = document.getElementById('reg-apellidos').value.trim();
            const fecha = document.getElementById('reg-fecha').value;
            const correo = document.getElementById('reg-correo').value.trim();
            const usuario = document.getElementById('reg-usuario').value.trim();
            const pass = document.getElementById('reg-password').value;
            const passRep = document.getElementById('reg-password-rep').value;

            if (pass !== passRep) {
                msgError.textContent = 'Las contraseñas no coinciden. Por favor, revísalas.';
                msgError.style.display = 'block';
                return;
            }

            let tipo2FA = null;
            let valor2FA = null;
            let preguntaSeleccionada = null;

            if (checkDobleVerif.checked) {
                if (!radioPin.checked && !radioPregunta.checked) {
                    msgError.textContent = 'Has activado la doble verificación pero no has seleccionado PIN ni Pregunta.';
                    msgError.style.display = 'block';
                    return;
                }
                if (radioPin.checked) {
                    valor2FA = inputPin.value;
                    if (valor2FA.length !== 6) {
                        msgError.textContent = 'El PIN debe tener exactamente 6 dígitos numéricos.';
                        msgError.style.display = 'block';
                        return;
                    }
                    tipo2FA = 'pin';
                }
                if (radioPregunta.checked) {
                    preguntaSeleccionada = selectPregunta.value === 'otra' ? inputPreguntaOtra.value : selectPregunta.options[selectPregunta.selectedIndex].text;
                    valor2FA = inputRespuesta.value;
                    if (selectPregunta.value === '' || valor2FA === '') {
                        msgError.textContent = 'Debes seleccionar una pregunta y escribir una respuesta para la doble verificación.';
                        msgError.style.display = 'block';
                        return;
                    }
                    tipo2FA = 'pregunta';
                }
            }

            btnRegistrar.disabled = true;
            btnRegistrar.textContent = 'CREANDO CUENTA...';

            try {
                const usernameRef = doc(db, 'nombres_usuario', usuario.toLowerCase());
                const usernameDoc = await getDoc(usernameRef);
                
                if (usernameDoc.exists()) {
                    throw new Error("El nombre de usuario ya está en uso. Por favor, elige otro.");
                }

                const userCredential = await createUserWithEmailAndPassword(auth, correo, pass);
                const uid = userCredential.user.uid;

                await setDoc(usernameRef, { uid: uid });

                await setDoc(doc(db, 'usuarios', uid), {
                    nombre: nombre,
                    apellidos: apellidos,
                    fechaNacimiento: fecha || null,
                    correo: correo,
                    usuario: usuario,
                    tutorialCompletado: 0, 
                    dobleVerificacion: {
                        activa: checkDobleVerif.checked,
                        tipo: tipo2FA,
                        pregunta: preguntaSeleccionada,
                        respuesta: valor2FA 
                    }
                });

                // Mostrar Modal de éxito real
                modalExito.style.display = 'flex';

            } catch (error) {
                console.error(error);
                if (error.code === 'auth/email-already-in-use') {
                    msgError.textContent = 'Este correo electrónico ya está registrado.';
                } else if (error.code === 'auth/weak-password') {
                    msgError.textContent = 'La contraseña es demasiado débil. Debe tener al menos 6 caracteres.';
                } else {
                    msgError.textContent = error.message || 'Ha ocurrido un error durante el registro.';
                }
                msgError.style.display = 'block';
                btnRegistrar.disabled = false;
                btnRegistrar.textContent = 'REGISTRAR';
            }
        });
    </script>
</body>
</html>
